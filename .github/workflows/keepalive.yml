# Render 免费实例闲置 15 分钟会休眠，评审首次打开需要 30–60 秒唤醒；
# 北京时间 9:00–22:59 每 10 分钟访问一次健康检查接口（UTC 01–14 点）；三道笔试题共用一个 Render 免费工作区，
# 每月共享 750 小时，只在白天保活以免超额（GitHub 定时任务可能有几分钟延迟）
name: keepalive
on:
  schedule:
    - cron: '*/10 1-14 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --max-time 90 https://recap-desk.onrender.com/api/health
